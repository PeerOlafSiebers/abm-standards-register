name: CI
on: { pull_request: {}, push: { branches-ignore: [main] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py          # data rules: fails the PR on errors, annotates the CSV
      - run: python scripts/build.py --out dist
      - run: pytest -q tests                     # validator + build tests
      - run: node --test tests/*.test.js         # search ranking + card rendering
